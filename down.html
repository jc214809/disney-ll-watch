<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride Down Detector</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

*, *::before, *::after { box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: #060c1a;
    background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(29, 78, 216, 0.25), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(124, 58, 237, 0.12), transparent);
    color: #e2e8f0;
    margin: 0;
    min-height: 100vh;
    padding: 0 0 60px;
}

header {
    text-align: center;
    padding: 48px 20px 24px;
    background: linear-gradient(180deg, rgba(29,78,216,0.12) 0%, transparent 100%);
    border-bottom: 1px solid rgba(99, 155, 255, 0.1);
}

h1 {
    margin: 0 0 10px;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #93c5fd 0%, #c4b5fd 50%, #f9a8d4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

nav { margin-bottom: 14px; display: flex; justify-content: center; gap: 10px; }
nav a {
    font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em; text-decoration: none;
    color: #94a3b8; padding: 5px 14px; border-radius: 999px;
    border: 1px solid rgba(51, 65, 85, 0.8);
}
nav a:hover { color: #e2e8f0; }
nav a.active { color: #e2e8f0; background: rgba(99, 155, 255, 0.15); border-color: rgba(99, 155, 255, 0.4); }

#updated {
    font-size: 0.8rem; color: #64748b; letter-spacing: 0.04em; text-transform: uppercase;
}

#summary { margin-top: 12px; font-size: 0.9rem; font-weight: 600; }
#summary.bad { color: #f87171; }
#summary.good { color: #4ade80; }

#errors, #content { max-width: 900px; margin: 24px auto 0; padding: 0 20px; }
#errors { margin-top: 16px; }

.error {
    background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5; border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; margin-bottom: 8px;
}

.cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }

.park-card {
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(51, 65, 85, 0.6);
    border-radius: 12px;
    overflow: hidden;
}
.park-card.has-down { border-color: rgba(248, 113, 113, 0.45); }

.park-header {
    display: flex; align-items: center; gap: 10px; padding: 14px 18px;
    background: rgba(30, 41, 59, 0.8); font-size: 0.85rem; font-weight: 600;
    letter-spacing: 0.03em; color: #cbd5e1; border-bottom: 1px solid rgba(51, 65, 85, 0.6);
}
.park-header img { width: 28px; height: 28px; opacity: 0.85; filter: invert(1); flex-shrink: 0; }
.park-header .count {
    margin-left: auto; font-size: 0.72rem; font-weight: 700; padding: 3px 10px;
    border-radius: 999px; letter-spacing: 0.06em; text-transform: uppercase;
}
.count.bad { color: #f87171; background: rgba(248, 113, 113, 0.12); border: 1px solid rgba(248, 113, 113, 0.25); }
.count.good { color: #4ade80; background: rgba(74, 222, 128, 0.12); border: 1px solid rgba(74, 222, 128, 0.25); }

.section-label {
    padding: 8px 18px; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: #475569;
}
.section-label.down { color: #f87171; background: rgba(239, 68, 68, 0.08); }

.ride {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 18px; font-size: 0.86rem; color: #cbd5e1;
    border-bottom: 1px solid rgba(30, 41, 59, 0.8);
}
.ride:last-child { border-bottom: none; }
.ride.down { background: rgba(239, 68, 68, 0.06); color: #fecaca; font-weight: 600; }
.ride .meta { font-size: 0.75rem; color: #64748b; white-space: nowrap; font-weight: 400; }

.badge {
    font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
}
.badge.DOWN { color: #f87171; background: rgba(248, 113, 113, 0.12); border: 1px solid rgba(248, 113, 113, 0.25); }
.badge.OPERATING { color: #4ade80; background: rgba(74, 222, 128, 0.1); border: 1px solid rgba(74, 222, 128, 0.2); }
.badge.CLOSED, .badge.REFURBISHMENT { color: #94a3b8; background: rgba(148, 163, 184, 0.1); border: 1px solid rgba(148, 163, 184, 0.2); }

details.others > summary {
    cursor: pointer; list-style: none; padding: 8px 18px; font-size: 0.72rem; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; color: #64748b;
    border-top: 1px solid rgba(30, 41, 59, 0.8);
}
details.others > summary::-webkit-details-marker { display: none; }
details.others > summary::before { content: '▸ '; }
details.others[open] > summary::before { content: '▾ '; }

@media (max-width: 640px) {
    .cards-grid { grid-template-columns: 1fr; }
    header { padding: 32px 16px 18px; }
    #content, #errors { padding: 0 12px; }
}
</style>
</head>

<body>

<header>
    <h1>Ride Down Detector</h1>
    <nav><a href="index.html">Lightning Lane</a><a href="down.html" class="active">Down Detector</a></nav>
    <div id="updated">Loading...</div>
    <div id="summary"></div>
</header>

<div id="errors"></div>
<div id="content"></div>

<script>
const API = 'https://api.themeparks.wiki/v1/entity';
const POLL_INTERVAL_MS = 60000;
const FALLBACK_PARKS = [
    { name: 'Magic Kingdom',     id: '75ea578a-adc8-4116-a54d-dccb60765ef9' },
    { name: 'EPCOT',             id: '47f90d2c-e191-4239-a466-5892ef59a88b' },
    { name: 'Hollywood Studios', id: '288747d1-8b4f-4a64-867e-ea7c9b27bad8' },
    { name: 'Animal Kingdom',    id: '1c84a229-8862-4648-9c71-378ddd2c7693' },
];
const parkIcons = {
    'Magic Kingdom':    'icons/magic-kingdom.svg',
    'EPCOT':            'icons/epcot.svg',
    'Hollywood Studios':'icons/hollywood-studios.svg',
    'Animal Kingdom':   'icons/animal-kingdom.svg',
};
const STATUS_LABEL = { DOWN: 'Down', OPERATING: 'Operating', CLOSED: 'Closed', REFURBISHMENT: 'Refurbishment' };

let parks = FALLBACK_PARKS;
const parkRides = {}; // park name -> [{ id, name, status, wait }]

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Down first, then operating, then everything else; alphabetical within a group.
const STATUS_ORDER = { DOWN: 0, OPERATING: 1 };
const rank = r => STATUS_ORDER[r.status] ?? 2;
const sortRides = rides => [...rides].sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));

function rideRow(r) {
    const wait = r.status === 'OPERATING' && r.wait != null ? `${r.wait} min` : '';
    const right = r.status === 'DOWN' || r.status === 'REFURBISHMENT' || r.status === 'CLOSED'
        ? `<span class="badge ${esc(r.status)}">${esc(STATUS_LABEL[r.status])}</span>`
        : `<span class="meta">${wait}</span>`;
    return `<div class="ride${r.status === 'DOWN' ? ' down' : ''}"><span>${esc(r.name)}</span>${right}</div>`;
}

function render() {
    const downTotal = Object.values(parkRides).flat().filter(r => r.status === 'DOWN').length;
    const summary = document.getElementById('summary');
    summary.className = downTotal ? 'bad' : 'good';
    summary.textContent = downTotal ? `${downTotal} ride${downTotal === 1 ? '' : 's'} down right now` : 'No rides down right now';

    // Parks with the most rides down first.
    const names = parks.map(p => p.name).filter(n => parkRides[n]);
    const downCount = n => parkRides[n].filter(r => r.status === 'DOWN').length;
    names.sort((a, b) => downCount(b) - downCount(a) || a.localeCompare(b));

    document.getElementById('content').innerHTML = '<div class="cards-grid">' + names.map(name => {
        const rides = sortRides(parkRides[name]);
        const down = rides.filter(r => r.status === 'DOWN');
        const operating = rides.filter(r => r.status === 'OPERATING');
        const other = rides.filter(r => r.status !== 'DOWN' && r.status !== 'OPERATING');
        const icon = parkIcons[name] ? `<img src="${parkIcons[name]}" alt="">` : '';
        return `
            <div class="park-card${down.length ? ' has-down' : ''}">
                <div class="park-header">${icon}${esc(name)}
                    <span class="count ${down.length ? 'bad' : 'good'}">${down.length ? `${down.length} down` : 'All up'}</span>
                </div>
                ${down.length ? `<div class="section-label down">Down now</div>${down.map(rideRow).join('')}` : ''}
                ${operating.length ? `<div class="section-label">Operating (${operating.length})</div>${operating.map(rideRow).join('')}` : ''}
                ${other.length ? `<details class="others"><summary>Closed / refurbishment (${other.length})</summary>${other.map(rideRow).join('')}</details>` : ''}
            </div>`;
    }).join('') + '</div>';
}

// Returns the number of parks that failed to refresh.
async function refresh() {
    let failures = 0;
    await Promise.all(parks.map(async ({ name, id }) => {
        try {
            const res = await fetch(`${API}/${id}/live`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const { liveData } = await res.json();
            parkRides[name] = (liveData || [])
                .filter(e => e.entityType === 'ATTRACTION')
                .map(e => ({ id: e.id, name: e.name, status: e.status || 'CLOSED', wait: e.queue?.STANDBY?.waitTime ?? null }));
        } catch (e) {
            failures++;
            console.warn(`Failed to load ${name}:`, e);
        }
    }));
    return failures;
}

function showStatus(failures, lastGood) {
    const fmt = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const el = document.getElementById('updated');
    if (!lastGood) el.textContent = 'Could not load ride data';
    else if (failures) el.textContent = `⚠ ${failures} park(s) failed to update · last update ${fmt(lastGood)}`;
    else el.textContent = `Updated ${fmt(lastGood)}`;
}

async function init() {
    try {
        const res = await fetch('config.json');
        const cfg = await res.json();
        if (cfg.parks?.length) parks = cfg.parks;
    } catch (e) { /* fall back to built-in park list */ }

    let lastGood = null;
    const run = async () => {
        const failures = await refresh();
        if (failures < parks.length) lastGood = new Date();
        showStatus(failures, lastGood);
        if (Object.keys(parkRides).length) render();
        else document.getElementById('content').innerHTML = '<div class="error">Could not load ride data from ThemeParks.wiki.</div>';
    };
    await run();
    setInterval(() => { if (!document.hidden) run(); }, POLL_INTERVAL_MS);
}

init();
</script>

</body>
</html>
